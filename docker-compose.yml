services:
  alpha-desk:
    build: .
    env_file:
      - .env
    volumes:
      - ${ALPHA_DESK_DATA_DIR:-alpha_desk_data}:/home/appuser/.alpha-desk
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  alpha-desk-ollama:
    build: .
    env_file:
      - .env
    environment:
      - ALPHA_DESK_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${ALPHA_DESK_DATA_DIR:-alpha_desk_data}:/home/appuser/.alpha-desk
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  alpha_desk_data:
  ollama_data:
